services:
  - type: web
    name: venai-api
    env: python
    rootDir: server
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: venai-db
          property: connectionString

databases:
  - name: venai-db
    databaseName: venai
    user: venai_user
    plan: free
